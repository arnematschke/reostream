name: reostream
version: 0.1.12
slug: reostream
description: Reolink camera proxy with HTTP-MPEG-TS, RTSP, and web interface
url: https://github.com/VoltTech21/reostream
image: ghcr.io/volttech21/reostream
arch:
  - amd64
  - aarch64
webui: "http://[HOST]:[PORT:8562]/"
panel_icon: mdi:cctv
ports:
  8560/tcp: 8560
  8561/tcp: 8561
  8562/tcp: 8562
ports_description:
  8560/tcp: HTTP-MPEG-TS streams
  8561/tcp: RTSP streams
  8562/tcp: Web interface
startup: services
boot: auto
init: false
